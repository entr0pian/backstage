apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-deployment
  title: Create deployment
  description: >-
    Ship a built version of a service to an environment, or (in dev) turn on
    auto-deploy so every successful build on main ships on its own. Opens a
    pull request with its Release; once it's merged, Argo CD rolls it out.
spec:
  owner: user:guest
  type: deployment

  parameters:
    - title: Deployment
      required:
        - componentName
        - environment
      # Version is required unless Auto-deploy is on — then there is none:
      # release-operator deploys every successful build on main itself.
      if:
        properties:
          autoDeploy:
            const: true
        required:
          - autoDeploy
      else:
        required:
          - version
      properties:
        componentName:
          title: Component
          type: string
          description: The service to deploy.
          ui:field: PlatformComponentPicker
        environment:
          title: Environment
          type: string
          description: Where it should run.
          ui:field: PlatformEnvironmentPicker
        autoDeploy:
          title: Auto-deploy
          type: boolean
          description: Deploy every successful build on main automatically, with no version to pick.
          default: false
          ui:field: PlatformAutoDeployToggle
        version:
          title: Version
          type: string
          description: Any commit on main with a green build. Not used when Auto-deploy is on.
          pattern: '^[0-9a-f]{40}$'
          ui:field: PlatformVersionPicker
        bindings:
          title: Bind dependencies
          type: object
          description: Infrastructure in that environment the service should connect to.
          ui:field: PlatformDependencyBindingsPicker

  steps:
    - id: render-release
      name: Render Release manifest
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: platform/environments/${{ parameters.environment }}
        values:
          componentName: ${{ parameters.componentName }}
          environment: ${{ parameters.environment }}
          autoDeploy: ${{ parameters.autoDeploy or false }}
          version: ${{ parameters.version }}
          bindings: ${{ parameters.bindings or {} }}

    # fetch:template only templates file *contents*, not file names (same as
    # add-database), so the static release.yaml is renamed to the
    # <component>-release.yaml the platform uses.
    - id: rename-release
      name: Rename to <component>-release.yaml
      action: fs:rename
      input:
        files:
          - from: platform/environments/${{ parameters.environment }}/release.yaml
            to: platform/environments/${{ parameters.environment }}/${{ parameters.componentName }}-release.yaml

    # One PR per deployment: the branch carries the version (or "auto" when
    # turning on auto-deploy), so each deploy gets its own PR and merging it
    # is what deploys that version.
    - id: open-pr
      name: Open pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=application-repositories&owner=entr0pian
        branchName: backstage/deploy-${{ parameters.componentName }}-${{ parameters.environment }}-${{ 'auto' if parameters.autoDeploy else (parameters.version | truncate(7, true, "")) }}
        title: ${{ ('Enable auto-deploy for ' + parameters.componentName + ' in ' + parameters.environment) if parameters.autoDeploy else ('Deploy ' + parameters.componentName + ' ' + (parameters.version | truncate(7, true, "")) + ' to ' + parameters.environment) }}
        description: |-
          Sets the `Release` for `${{ parameters.componentName }}` in `${{ parameters.environment }}`.

          | Field | Value |
          |---|---|
          | Component | `${{ parameters.componentName }}` |
          | Environment | `${{ parameters.environment }}` |
          | Version | ${{ 'auto-deploy: every successful build on `main`' if parameters.autoDeploy else ('`' + parameters.version + '`') }} |
          | Database | ${{ ('`' + parameters.bindings.database + '`') if (parameters.bindings and parameters.bindings.database) else 'not bound' }} |

          Generated through Backstage's **Create deployment** template. Writes
          the whole of `platform/environments/${{ parameters.environment }}/${{ parameters.componentName }}-release.yaml`:
          for a new environment that's a new file, for an existing one the
          diff is only what changed (usually `version:`; `autoDeploy:` in
          place of `version:` when turning auto-deploy on, and the reverse
          when pinning a version again).

          Merging deploys it: release-operator writes the component's
          environment files and Argo CD syncs them. With auto-deploy on,
          release-operator keeps doing that for every new successful build on
          `main`, with no further PRs.

  output:
    links:
      - title: Pull request
        url: ${{ steps['open-pr'].output.remoteUrl }}
