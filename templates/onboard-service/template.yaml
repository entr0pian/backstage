apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: onboard-service
  title: Onboard Service
  description: >-
    Start a new service: a GitHub repository scaffolded from a versioned
    template, plus its place in the catalog. Opens one pull request; the
    platform does the rest once it's merged.
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - owner
        - scaffoldVersion
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase with dashes, e.g. order-service. Also the repository name.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: The team that owns it.
        visibility:
          title: Repository visibility
          type: string
          description: Who can see the new GitHub repository.
          enum:
            - public
            - private
            - internal
          default: public
        scaffoldTemplate:
          title: Scaffold template
          type: string
          description: The starter the repository is created from.
          enum:
            - golang-service
          default: golang-service
        scaffoldVersion:
          title: Scaffold version
          type: string
          description: Latest by default; pick an older one only to pin it.
          pattern: '^\d+\.\d+\.\d+$'
          ui:field: PlatformScaffoldVersionPicker
        autoDeploy:
          title: Auto deployment
          type: object
          description: >-
            Also add a Release that follows main: every successful build
            deploys, with no PR per deploy. Turn it off later with Create
            deployment.
          # The field fills in environment: the first of
          # platform.autoDeployEnvironments (app-config).
          default:
            enabled: true
          ui:field: PlatformAutoDeploySetup

  steps:
    - id: render-component
      name: Render Component manifest
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: platform/registry
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          visibility: ${{ parameters.visibility }}
          scaffoldTemplate: ${{ parameters.scaffoldTemplate }}
          scaffoldVersion: ${{ parameters.scaffoldVersion }}

    # fetch:template only templates file *contents*, not file/directory
    # names, so the skeleton's static component.yaml needs an explicit
    # rename to <name>.yaml here.
    - id: rename-component
      name: Rename to component name
      action: fs:rename
      input:
        files:
          - from: platform/registry/component.yaml
            to: platform/registry/${{ parameters.name }}.yaml

    # On by default: a Release following main, with no version and no
    # bindings, at the same path and name Create deployment uses — so
    # Create deployment later shows it as committed and edits this file.
    # The Component's repository doesn't exist until this PR merges;
    # release-operator waits (WaitingForFirstBuild) until the first CI run
    # on main succeeds, then commits that build's version to this file.
    - id: render-release
      name: Render auto-deploy Release
      if: ${{ parameters.autoDeploy.enabled and parameters.autoDeploy.environment }}
      action: fetch:template
      input:
        url: ./release
        targetPath: platform/environments/${{ parameters.autoDeploy.environment }}
        values:
          name: ${{ parameters.name }}
          environment: ${{ parameters.autoDeploy.environment }}

    - id: rename-release
      name: Rename to <name>-release.yaml
      if: ${{ parameters.autoDeploy.enabled and parameters.autoDeploy.environment }}
      action: fs:rename
      input:
        files:
          - from: platform/environments/${{ parameters.autoDeploy.environment }}/release.yaml
            to: platform/environments/${{ parameters.autoDeploy.environment }}/${{ parameters.name }}-release.yaml

    - id: open-pr
      name: Open pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=application-repositories&owner=entr0pian
        branchName: backstage/onboard-${{ parameters.name }}
        title: 'Onboard component: ${{ parameters.name }}'
        description: |-
          Onboards `${{ parameters.name }}` as a new platform Component via Backstage.

          | Field | Value |
          |---|---|
          | Component | `${{ parameters.name }}` |
          | Owner | `${{ parameters.owner }}` |
          | Repository visibility | `${{ parameters.visibility }}` |
          | Scaffold template | `${{ parameters.scaffoldTemplate }}` |
          | Scaffold version | `${{ parameters.scaffoldVersion }}` |
          | Auto-deploy | ${{ ('to `' + parameters.autoDeploy.environment + '`: every successful build on `main`') if (parameters.autoDeploy.enabled and parameters.autoDeploy.environment) else 'no' }} |

          Generated through Backstage's **Onboard Service** template. Adds
          `platform/registry/${{ parameters.name }}.yaml`${{ (' and `platform/environments/' + parameters.autoDeploy.environment + '/' + parameters.name + '-release.yaml`') if (parameters.autoDeploy.enabled and parameters.autoDeploy.environment) else '' }}.

  output:
    links:
      - title: Pull request
        url: ${{ steps['open-pr'].output.remoteUrl }}
