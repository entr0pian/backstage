{{- /*
One Secret per remote environment's cluster, from the connection details its
own Terraform publishes to taskapp/clusters/<env> (the same entry Argo CD's
cluster Secret is built from). Mounted as files under
.Values.kubernetes.clustersDir, where the backend's platformClusters module
picks them up. No credential in it: Backstage signs its own EKS token with
its Pod Identity role (taskapp-backstage). deletionPolicy Delete: when the
cluster is destroyed, its folder disappears and Backstage stops listing it.
*/ -}}
{{- range (include "backstage.remoteEnvironments" . | splitList "\n" | compact) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $.Release.Name }}-cluster-{{ . }}
  labels:
    app: {{ $.Chart.Name }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: {{ $.Values.kubernetes.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $.Release.Name }}-cluster-{{ . }}
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: taskapp/clusters/{{ . }}
{{- end }}
