{{- if .Values.platformCatalog.enabled }}
# Read-only, scoped to exactly the resource type PlatformEntityProvider
# lists — get/list/watch only, no create/update/patch/delete, per
# BACKSTAGE_PART4.md's Phase 4 constraint. A ClusterRole (not a per-namespace
# Role) because the RBAC rule targets a resource *type*, not specific
# namespaces — namespaces to actually poll are a Backstage-side config
# concern (platformCatalog.namespaces), not an RBAC one, so adding a new
# environment later needs no RBAC change here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-platform-catalog
  labels:
    app: {{ .Chart.Name }}
rules:
  - apiGroups: ["database.taskapp.io"]
    resources: ["databases"]
    verbs: ["get", "list", "watch"]
  # Read-only, for the Deployments tab's Release-CR discovery — see
  # BACKSTAGE_PART5.md Step 11. Same ClusterRole, not a second one: both
  # rules are read-only access for this one ServiceAccount, and Release
  # CRs live in the same namespaces platformCatalog.namespaces already
  # configures.
  - apiGroups: ["platform.taskapp.io"]
    resources: ["releases"]
    verbs: ["get", "list", "watch"]
  # Environment Details summary (BACKSTAGE_PART9.md Part A) — workload,
  # networking, binding and warning-event state for one component in one
  # environment, selected by the platform.taskapp.io/* labels. Read-only.
  # Deliberately NOT here: secrets (credentials are shown as a Secrets
  # Manager path, never read) and pods/log (logs stay behind the Kubernetes
  # plugin's owner-only permission — clusterrole-kubernetes.yaml).
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
{{- end }}
