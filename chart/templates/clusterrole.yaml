{{- if .Values.platformCatalog.enabled }}
# Read-only, scoped to exactly the resource type PlatformEntityProvider
# lists — get/list/watch only, no create/update/patch/delete, per
# BACKSTAGE_PART4.md's Phase 4 constraint. A ClusterRole (not a per-namespace
# Role) because the RBAC rule targets a resource *type*, not specific
# namespaces — namespaces to actually poll are a Backstage-side config
# concern (platformCatalog.namespaces), not an RBAC one, so adding a new
# environment later needs no RBAC change here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-platform-catalog
  labels:
    app: {{ .Chart.Name }}
rules:
  - apiGroups: ["database.taskapp.io"]
    resources: ["databases"]
    verbs: ["get", "list", "watch"]
{{- end }}
