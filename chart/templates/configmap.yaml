apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Chart.Name }}
data:
  # Layered on top of app-config.yaml + app-config.production.yaml (see
  # deployment.yaml's args). Three jobs:
  #   1. Cancel app-config.production.yaml's `database.client: pg` — we
  #      haven't wired up Postgres yet (see backstage/README.md), so this
  #      keeps the in-memory sqlite default instead of crashing on missing
  #      POSTGRES_* env vars.
  #   2. When Values.baseUrl is set, override the localhost defaults so the
  #      app/backend/CORS URLs are actually reachable through the Ingress.
  #   3. Allow the guest auth provider outside a dev environment — Backstage
  #      refuses it by default whenever NODE_ENV=production (which the
  #      Dockerfile always sets). Guest is deliberate here: it's how
  #      visitors browse the portfolio, and the backend permission policy
  #      (packages/backend/src/modules/permissionPolicy) keeps them
  #      read-only.
  #   4. When Values.githubAuth.secretPath is set, configure the owner's
  #      GitHub sign-in. usernameMatchingUserEntityName only admits a
  #      GitHub user with a matching User entity (org-data/users.yaml), so
  #      no other GitHub account can sign in at all.
  app-config.cluster.yaml: |
    auth:
      environment: production
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
        {{- if .Values.githubAuth.secretPath }}
        github:
          production:
            clientId: ${AUTH_GITHUB_CLIENT_ID}
            clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
        {{- end }}
    backend:
      database:
        client: better-sqlite3
        connection: ':memory:'
      {{- if .Values.baseUrl }}
      baseUrl: ${BACKSTAGE_BASE_URL}
      cors:
        origin: ${BACKSTAGE_BASE_URL}
      {{- end }}
    {{- if .Values.baseUrl }}
    app:
      baseUrl: ${BACKSTAGE_BASE_URL}
    {{- end }}
    {{- if .Values.platformCatalog.enabled }}
    platformCatalog:
      enabled: true
      namespaces: {{ .Values.platformCatalog.namespaces | toJson }}
      {{- with .Values.platformCatalog.gitopsRepoUrl }}
      gitopsRepoUrl: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- if .Values.deployments.enabled }}
    # @backstage-community/plugin-argocd-backend's own config contract (see
    # BACKSTAGE_PART5.md Step 5) — not a custom platform.argocd.* shape.
    argocd:
      # Despite the name, this is the plugin's only knob for trusting a
      # self-signed cert (sets rejectUnauthorized: false on undici's global
      # dispatcher — see @backstage-community/plugin-argocd-node's
      # ArgoCDService constructor). Needed here because ArgoCD always
      # terminates TLS itself with a self-signed cert (server.insecure not
      # set in bootstrap-cluster/install-argocd/values.yaml) — not actually
      # a "local dev only" concern in this cluster.
      localDevelopment: true
      appLocatorMethods:
        - type: config
          instances:
            - name: primary
              url: ${ARGOCD_URL}
              token: ${ARGOCD_TOKEN}
    {{- end }}
    {{- if .Values.kubernetes.enabled }}
    # @backstage/plugin-kubernetes-backend, read-only against the cluster
    # Backstage itself runs on — powers the Deployments tab's per-environment
    # Logs (BACKSTAGE_PART8.md). No token configured: the serviceAccount auth
    # provider then reads this pod's own projected ServiceAccount token on
    # every request, so there's no Secret to manage and rotation is free.
    # What that ServiceAccount may do is limited by clusterrole-kubernetes.yaml.
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: {{ .Values.kubernetes.clusterName }}
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    {{- end }}
