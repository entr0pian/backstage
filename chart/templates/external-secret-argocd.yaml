{{- if .Values.argocd.secretPath }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-argocd-credentials
  labels:
    app: {{ .Chart.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.argocd.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-argocd-credentials
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: {{ .Values.argocd.secretPath }}
      property: token
{{- end }}
