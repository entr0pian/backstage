replicaCount: 1

image:
  repository: ghcr.io/entr0pian/backstage
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false
  className: nginx
  path: /
  pathType: Prefix

# Externally-reachable base URL (e.g. https://backstage.example.com), used for
# app.baseUrl / backend.baseUrl / backend.cors.origin. Leave empty to run on
# the in-image app-config.yaml's localhost defaults — fine for a smoke test
# reached via port-forward, wrong for anything reached through the Ingress.
baseUrl: ""

github:
  # Path to the secret in AWS Secrets Manager holding the PAT the platform's
  # other GitHub-talking operators (component-operator, scaffold-operator)
  # already use for entr0pian — same underlying token, synced into this
  # namespace too since a Kubernetes Secret can't be mounted cross-namespace.
  # Expected JSON format: {"token": "<value>", "owner": "<github org or user>"}
  # Leave empty to skip creating the ExternalSecret — the GitHub catalog
  # integration and the Onboard Service template's PR step won't work without it.
  secretPath: ""
  clusterSecretStoreName: aws-secrets-manager

argocd:
  # In-cluster ArgoCD server URL — both Backstage and ArgoCD run on the same
  # management cluster, so this never needs to leave the cluster network.
  baseUrl: "http://argocd-server.argocd.svc.cluster.local"
  # Path to the secret in AWS Secrets Manager holding the read-only ArgoCD
  # API token for the "backstage" account (see bootstrap-cluster/install-argocd
  # values.yaml's accounts.backstage / policy.csv, and
  # platform-architecture/BACKSTAGE_PART5.md Step 9/10).
  # Expected JSON format: {"token": "<value>"}
  # Leave empty to skip creating the ExternalSecret and disable the
  # Deployments tab's ArgoCD integration.
  secretPath: ""
  clusterSecretStoreName: aws-secrets-manager

deployments:
  # Gates both the app-config platform.deployments/platform.argocd block and
  # (indirectly, since the ExternalSecret needs argocd.secretPath too) the
  # backend's Deployments-tab endpoint. Disableable for local dev per
  # BACKSTAGE_PART5.md Step 9.
  enabled: false

platformCatalog:
  # Discovers Database CRs from these namespaces and publishes them as
  # catalog Resource entities. "management" is included alongside dev/prod
  # so a single-cluster setup (e.g. this EKS cluster standing in for all
  # three environments) still gets discovery — platform/environments/<env>
  # just picks a namespace on whichever cluster runs release-operator, so
  # this is harmless even once real dev/prod clusters exist too.
  enabled: false
  namespaces:
    - dev
    - prod
    - management

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
