app:
  title: Platform · gerodimos.dev
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /

    # Disable stock Backstage Catalog cards that are empty/near-empty for
    # every service here today (no APIs registered, no manual System/Domain
    # modeling) — see platform-architecture/BACKSTAGE_PART6.md. Platform
    # data gets its own purpose-built cards (Deployments, Dependencies)
    # instead. Catalog relationships themselves are untouched — this only
    # hides the generic presentation of them on Overview.
    - entity-card:catalog/depends-on-components: false
    - entity-card:catalog/depends-on-resources: false
    - entity-card:catalog/has-subcomponents: false
    - entity-card:api-docs/provided-apis: false
    - entity-card:api-docs/consumed-apis: false
    - entity-card:catalog-graph/relations: false

    # One Deployments tab (packages/app/src/modules/deployments) instead of
    # the Argo CD plugin's separate Deployment Lifecycle / Deployment
    # Summary tabs — see platform-architecture/BACKSTAGE_PART7.md. The
    # plugin stays installed for its backend (sync/health per Application,
    # read by the Deployments tab); its frontend views are no longer used —
    # per-environment Details replaced them (BACKSTAGE_PART9.md).
    - entity-content:backstage-community-argocd/deployment-lifecycle: false
    - entity-content:backstage-community-argocd/deployment-summary: false
    # Same for the Kubernetes plugin's generic tab: its API client, backend
    # and PodLogs are reused by the Deployments tab's per-environment Logs
    # (BACKSTAGE_PART8.md) — a second, cluster/namespace-oriented tab would
    # break the component -> environment view.
    - entity-content:kubernetes/kubernetes: false

    - entity-content:app/deployments:
        config:
          # Browser-reachable Argo CD UI for "Open in Argo CD" — the
          # port-forward for now; switch to the real domain once it exists.
          argocdUiUrl: https://localhost:9080

    # Tab order: Overview | Deployments | TechDocs | APIs. The entity page
    # sorts tabs by content group in this order (TechDocs is in
    # "documentation", APIs in "development", our Deployments tab in
    # "deployment"); a group with a single tab renders as a plain tab.
    - page:catalog/entity:
        config:
          groups:
            - overview:
                title: Overview
            - deployment:
                title: Deployments
            - documentation:
                title: Documentation
            - development:
                title: Development
            - operation:
                title: Operation
            - observability:
                title: Observability

organization:
  name: gerodimos.dev

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location]
  providers:
    # Discovers catalog-info.yaml from every entr0pian repository — this is
    # how a scaffolded platform component (see platform-scaffolds'
    # golang-service catalog-info.yaml.tpl) becomes a Catalog entity without
    # manual "Register Existing Component". Reuses the same GitHub PAT
    # already configured under integrations.github above (GITHUB_TOKEN).
    # See BACKSTAGE_PART2.md in platform-architecture for the full milestone.
    github:
      entr0pian:
        organization: 'entr0pian'
        catalogPath: '/catalog-info.yaml'
        filters:
          branch: 'main'
          repository: '.*'
        schedule:
          # Was 30 min/3 min — lowered so a newly scaffolded (or deleted)
          # repository shows up in the Catalog within ~2 minutes instead of
          # up to half an hour. A full org scan (~17 repos today) completes
          # in well under a minute, so 1 min timeout has headroom.
          frequency: { minutes: 2 }
          timeout: { minutes: 1 }
  locations:
    # NOTE: app-config.production.yaml (used by the deployed image, see its
    # own CMD in packages/backend/Dockerfile) declares its OWN catalog.locations
    # array that fully replaces this one at runtime — Backstage config arrays
    # override, they don't merge across --config files. Any Template location
    # added here (a new `- type: file` entry with `rules: [allow: [Template]]`)
    # must be added to app-config.production.yaml too, or it silently never
    # registers in the deployed instance despite looking correct here.
    # File locations are relative to the backend process, typically `packages/backend`

    # Onboard Service template — see BACKSTAGE.md (platform-architecture repo)
    - type: file
      target: ../../templates/onboard-service/template.yaml
      rules:
        - allow: [Template]

    # Add Database template — see BACKSTAGE_PART3.md (platform-architecture repo)
    - type: file
      target: ../../templates/add-database/template.yaml
      rules:
        - allow: [Template]

    # Guest User/Group that guest sign-in resolves to
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    # Real team Group entities — see org-data/teams.yaml and
    # BACKSTAGE_PART6.md item 15.
    - type: file
      target: ../../org-data/teams.yaml
      rules:
        - allow: [Group]

    # The owner User entity the GitHub sign-in resolves to — see
    # org-data/users.yaml.
    - type: file
      target: ../../org-data/users.yaml
      rules:
        - allow: [User]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# Platform Entity Provider — discovers Database CRs (database.taskapp.io)
# from the configured namespaces and publishes them as catalog Resource
# entities related to their owning Component (spec.componentRef). See
# BACKSTAGE_PART4.md and packages/backend/src/modules/platformEntityProvider/.
# Off by default so local `yarn start` needs no cluster; the deployed chart
# turns this on via app-config.cluster.yaml (see chart/values.yaml's
# platformCatalog block).
platformCatalog:
  enabled: false
  namespaces: []

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
